name: Windows Release
on:
  workflow_dispatch:
  push:
    branches: [build/windows-release]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and check Win32 Release
        shell: pwsh
        run: ./ci/build.ps1
      - name: Upload executable, package and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LavaXVM-Release-x86
          path: dist/*
          if-no-files-found: error
          retention-days: 30
